<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Design mockup of the Boost Rx self-monitoring website. Sample data only; not a live study site.">
<title>Boost Rx Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: a sticky preview switcher (Sign in / Participant / Admin). Participant = phone-width column with a 5-tab bottom bar.
   Admin = wide desktop table. Palette: muted teal-blue + sage on warm off-white, every text pair 7:1 or better. */
:root {
  --bg: #F4F2EC; --surface: #FFFFFF; --sunk: #EEF3F2;
  --ink: #1F2A37; --ink-muted: #434E5B;
  --primary: #185A72; --primary-soft: #DCEBF0;
  --success: #24573F; --success-soft: #E1EEE6;
  --warn-ink: #5E3D00; --warn-soft: #F8EDD5;
  --danger: #7F2A1D; --danger-soft: #F7E3DF; --link: #134C61;
  --line: #7B8794; --hair: #E4E2DB;
  --shadow: 0 1px 2px rgb(31 42 55 / .06), 0 4px 16px rgb(31 42 55 / .05);
  --font: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .logo-img { background: #F4F2EC; border-radius: 12px; padding: 6px 10px; box-sizing: content-box; }
  :root:not([data-theme="light"]) {
    --bg: #141C24; --surface: #1D2731; --sunk: #18222B; --ink: #E6EAEE; --ink-muted: #BAC3CC;
    --primary: #86CBDD; --primary-soft: #1F3A46; --link: #86CBDD; --success: #9AD6B5; --success-soft: #1C362A;
    --warn-ink: #F2C97D; --warn-soft: #33291A; --danger: #F4A595; --danger-soft: #3A2320; --line: #6B7785; --hair: #2A3641;
    --shadow: 0 1px 2px rgb(0 0 0 / .3); color-scheme: dark;
  }
}
:root[data-theme="dark"] .logo-img { background: #F4F2EC; border-radius: 12px; padding: 6px 10px; box-sizing: content-box; }
:root[data-theme="dark"] {
  --bg: #141C24; --surface: #1D2731; --sunk: #18222B; --ink: #E6EAEE; --ink-muted: #BAC3CC;
  --primary: #86CBDD; --primary-soft: #1F3A46; --link: #86CBDD; --success: #9AD6B5; --success-soft: #1C362A;
  --warn-ink: #F2C97D; --warn-soft: #33291A; --danger: #F4A595; --danger-soft: #3A2320; --line: #6B7785; --hair: #2A3641;
  --shadow: 0 1px 2px rgb(0 0 0 / .3); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 18px; line-height: 1.5; margin: 0; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { text-wrap: balance; margin: 0; line-height: 1.2; }
p { margin: 0; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--primary); outline-offset: 3px; border-radius: 8px; }
.muted { color: var(--ink-muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* Preview switcher */
.switcher { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--ink); color: var(--bg); padding: 8px 16px; display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; font-size: .9rem; }
.switcher .lbl { font-weight: 700; letter-spacing: .05em; text-transform: uppercase; font-size: .78rem; opacity: .85; }
.switcher .opts { display: flex; gap: 4px; background: color-mix(in srgb, var(--bg) 14%, transparent); padding: 3px; border-radius: 10px; }
.switcher button { border: 0; background: none; color: inherit; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-weight: 600; min-height: 36px; }
.switcher button[aria-pressed="true"] { background: var(--bg); color: var(--ink); }
.switch-link { color: inherit; font-weight: 700; text-underline-offset: 3px; min-height: 36px; display: inline-flex; align-items: center; }

/* Shared */
.wrap { max-width: 540px; margin: 0 auto; padding: 22px 16px 132px; display: grid; gap: 26px; }
.wrap.wide { max-width: 1160px; padding-bottom: 48px; }
.section { display: grid; gap: 10px; min-width: 0; }
.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding-inline: 4px; flex-wrap: wrap; }
.section-head h2 { font-size: 1.3rem; font-weight: 700; }
.count { font-size: 1rem; color: var(--ink-muted); font-variant-numeric: tabular-nums; }
.count.met { color: var(--success); font-weight: 700; }
.hint { font-size: 1rem; color: var(--ink-muted); padding-inline: 4px; margin-top: -4px; }
.group { background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); overflow: hidden; min-width: 0; }
.pad { padding: 18px; display: grid; gap: 14px; }
.row + .row { border-top: 1px solid var(--hair); }
.foot { font-size: .92rem; color: var(--ink-muted); padding-inline: 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 48px; padding: 8px 16px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; font-size: 1rem; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; text-align: left; }
.chip svg { width: 18px; height: 18px; stroke: currentColor; flex: none; }
.chip[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--surface); font-weight: 700; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 4px; gap: 4px; }
.seg button { min-height: 48px; border: 0; border-radius: 10px; background: transparent; cursor: pointer; font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--primary); color: var(--surface); }
.btn { min-height: 56px; padding: 0 22px; border-radius: 14px; border: 0; background: var(--primary); color: var(--surface); font-weight: 700; font-size: 1.05rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn svg { width: 18px; height: 18px; stroke: currentColor; }
.btn.small { min-height: 44px; font-size: .95rem; padding: 0 16px; border-radius: 10px; }
.btn.ghost { background: var(--surface); color: var(--primary); border: 1.5px solid var(--primary); }
.field { display: grid; gap: 6px; min-width: 0; }
.field label { font-weight: 600; font-size: 1rem; }
.field small { color: var(--ink-muted); font-size: .88rem; }
.input { min-height: 52px; width: 100%; min-width: 0; padding: 0 14px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); font-size: 1.05rem; }
.input.err { border-color: var(--danger); }
.err-msg { color: var(--danger); font-size: .92rem; font-weight: 600; }
.banner { padding: 12px 16px; border-radius: 14px; font-size: .98rem; }
.banner.info { background: var(--primary-soft); color: var(--ink); }
.banner.bad { background: var(--danger-soft); color: var(--danger); font-weight: 600; display: grid; gap: 10px; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.tag { display: inline-flex; align-items: center; font-size: .8rem; font-weight: 700; letter-spacing: .04em; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
.tag.sample { text-transform: uppercase; color: var(--warn-ink); background: var(--warn-soft); }
.tag.ok { color: var(--success); background: var(--success-soft); }
.tag.warn { color: var(--warn-ink); background: var(--warn-soft); }
.tag.bad { color: var(--danger); background: var(--danger-soft); }
.tag.dim { color: var(--ink-muted); background: var(--sunk); }

/* Sign in */
.signin { max-width: 960px; margin: 0 auto; padding: 40px 16px 60px; display: grid; grid-template-columns: 1.1fr .9fr; gap: 40px; align-items: center; }
.logo { display: inline-flex; align-items: center; gap: 12px; font-weight: 800; font-size: 1.6rem; letter-spacing: -.01em; }
.logo-img { display: block; height: 76px; width: auto; }
.signin h1 { font-size: 2.3rem; font-weight: 800; letter-spacing: -.02em; margin-top: 22px; }
.signin .lede { font-size: 1.1rem; color: var(--ink-muted); margin-top: 14px; max-width: 34em; }
.facts { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
.signin-card { background: var(--surface); border-radius: 24px; box-shadow: var(--shadow); padding: 26px 22px; display: grid; gap: 16px; }
.linkish { background: none; border: 0; color: var(--link, var(--primary)); font-weight: 700; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; padding: 8px 0; min-height: 44px; }
@media (max-width: 760px) { .signin { grid-template-columns: 1fr; gap: 28px; padding-top: 28px; } .signin h1 { font-size: 1.9rem; } }

/* Participant header */
.hello { display: grid; gap: 16px; }
.hello-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.date { font-size: 1rem; color: var(--ink-muted); font-weight: 500; }
.hello h1 { font-size: 1.8rem; font-weight: 800; letter-spacing: -.01em; }
.study { background: var(--surface); border-radius: 20px; padding: 18px 20px; box-shadow: var(--shadow); display: grid; gap: 14px; }
.study-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.weeks { display: grid; grid-template-columns: repeat(14, 1fr); gap: 4px; }
.weeks span { height: 10px; border-radius: 3px; background: var(--hair); }
.weeks span.done { background: var(--primary); }
.weeks span.now { background: var(--primary); opacity: .45; }
.goals { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.goal { display: grid; justify-items: center; gap: 4px; text-align: center; min-width: 0; }
.goal svg { width: 56px; height: 56px; }
.goal circle { fill: none; stroke-width: 6; }
.goal .t { stroke: var(--hair); }
.goal .f { stroke: var(--primary); stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; transition: stroke-dashoffset .5s ease; }
.goal.met .f { stroke: var(--success); }
.goal text { fill: var(--ink); font: 700 15px var(--font); }
.goal > b { font-size: 1rem; line-height: 1.2; }
.goal span { font-size: .85rem; color: var(--ink-muted); line-height: 1.25; }

/* Day and week pickers */
.daybar, .weekpick { display: grid; grid-template-columns: 52px 1fr 52px; align-items: center; gap: 8px; }
.daybar { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); padding: 6px; }
.arrow { height: 52px; border-radius: 12px; border: 0; background: var(--sunk); cursor: pointer; display: grid; place-items: center; }
.weekpick .arrow { background: var(--surface); box-shadow: var(--shadow); }
.arrow:disabled { opacity: .35; cursor: not-allowed; }
.arrow svg { width: 24px; height: 24px; stroke: var(--ink); }
.pick-label { text-align: center; font-weight: 700; display: grid; line-height: 1.25; }
.weekpick .pick-label { font-weight: 800; font-size: 1.2rem; }
.pick-label small { font-weight: 500; color: var(--ink-muted); font-size: .88rem; }

/* Rows */
.row-btn { width: 100%; min-height: 68px; display: flex; align-items: center; gap: 16px; padding: 12px 18px; background: none; border: 0; text-align: left; cursor: pointer; }
.check { flex: none; width: 34px; height: 34px; border-radius: 50%; border: 2.5px solid var(--line); display: grid; place-items: center; transition: background .2s, border-color .2s; }
.check.sq { border-radius: 10px; }
.check svg { width: 20px; height: 20px; stroke: var(--surface); opacity: 0; }
.on .check { background: var(--success); border-color: var(--success); }
.on .check svg { opacity: 1; }
.row-text { flex: 1; display: grid; min-width: 0; }
.row-title { font-weight: 600; }
.row-sub { font-size: .95rem; color: var(--ink-muted); }
.on .row-sub { color: var(--success); font-weight: 600; }
.chev { width: 22px; height: 22px; stroke: var(--ink-muted); flex: none; }
.detail { background: var(--sunk); padding: 16px 18px 20px; display: grid; gap: 18px; }
.q { display: grid; gap: 10px; }
.q-label { font-weight: 600; font-size: 1rem; }

/* Servings */
.tokens { display: grid; gap: 10px; }
.tokens.five { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.tokens.eight, .tokens.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.tok { height: 64px; min-width: 0; border-radius: 16px; border: 2px dashed var(--line); background: transparent; cursor: pointer; display: grid; place-items: center; }
.tok svg { width: 28px; height: 28px; stroke: var(--line); }
.tok.full { background: var(--primary-soft); border: 2px solid var(--primary); }
.tok.full svg { stroke: var(--primary); }
.tok b { font-size: 1.05rem; color: var(--ink-muted); }
.tok.full b { color: var(--ink); }
.met .tok.full { background: var(--success-soft); border-color: var(--success); }
.met .tok.full svg { stroke: var(--success); }
.serve-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.serve-foot p { font-size: 1rem; }
.serve-foot p.met { color: var(--success); font-weight: 700; }
.minus { min-height: 48px; padding: 0 16px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; font-size: 1rem; font-weight: 600; flex: none; }
.minus:disabled { opacity: .4; cursor: not-allowed; }

/* Symptoms */
.sym-detail { padding: 0 18px 18px 68px; display: grid; gap: 8px; }
.sev input[type="range"] { width: 100%; height: 48px; margin: 0; accent-color: var(--primary); cursor: pointer; }
.sev.unrated input[type="range"] { accent-color: var(--line); }
.sev-ticks { display: flex; justify-content: space-between; padding: 0 6px; font-weight: 700; font-size: .95rem; }
.scale-ends { display: flex; justify-content: space-between; gap: 12px; font-size: .86rem; color: var(--ink-muted); line-height: 1.3; }
.scale-ends span:last-child { text-align: right; }

/* Activity */
.total { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.total b { font-size: 2.5rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.meter { height: 14px; border-radius: 999px; background: var(--hair); overflow: hidden; }
.meter > span { display: block; height: 100%; background: var(--primary); border-radius: 999px; transition: width .5s ease; }
.meter.done > span { background: var(--success); }
.bars { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; align-items: end; }
.bar-col { display: grid; gap: 6px; min-width: 0; text-align: center; background: none; border: 0; padding: 0; cursor: pointer; border-radius: 10px; }
.bar-col:disabled { cursor: default; }
.bar-track { height: 84px; display: flex; align-items: flex-end; border-radius: 10px; background: var(--sunk); overflow: hidden; }
.bar-track span { width: 100%; background: var(--primary); border-radius: 10px 10px 0 0; }
.bar-col.sel .bar-track { outline: 2.5px solid var(--primary); outline-offset: 2px; }
.bar-col b { font-size: .95rem; font-variant-numeric: tabular-nums; min-height: 1.4em; }
.bar-col small { font-size: .8rem; color: var(--ink-muted); font-weight: 600; }
.ladder { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.rung { display: grid; gap: 2px; text-align: center; padding: 10px 2px; border-radius: 12px; background: var(--sunk); min-width: 0; }
.rung b { font-size: 1.02rem; font-variant-numeric: tabular-nums; }
.rung span { font-size: .76rem; color: var(--ink-muted); }
.rung.now { background: var(--primary); }
.rung.now b, .rung.now span { color: var(--surface); }
.inline { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.inline .input { max-width: 140px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }

/* Weight */
.wchart svg { width: 100%; height: auto; display: block; }
.wchart .grid { stroke: var(--hair); stroke-width: 1; }
.wchart .axis { fill: var(--ink-muted); font: 500 12px var(--font); }
.wchart .line { fill: none; stroke: var(--primary); stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
.wchart .area { fill: var(--primary-soft); opacity: .7; }
.wchart .pt { fill: var(--surface); stroke: var(--primary); stroke-width: 3; pointer-events: none; }
.wchart .pt.sel { fill: var(--primary); }
.wchart .hit { fill: transparent; cursor: pointer; }
.big-stat { display: flex; gap: 22px; flex-wrap: wrap; }
.big-stat div { display: grid; }
.big-stat b { font-size: 2rem; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
.big-stat span { font-size: .9rem; color: var(--ink-muted); }

/* Progress */
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--hair); }
.stat { background: var(--surface); padding: 16px 18px; display: grid; gap: 4px; min-width: 0; align-content: start; }
.stat b { font-size: 1.6rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat b small { font-size: 1rem; font-weight: 600; color: var(--ink-muted); }
.stat span { font-size: .92rem; color: var(--ink-muted); line-height: 1.3; }
.stat .tag { justify-self: start; margin-top: 4px; }
.stat:last-child:nth-child(odd) { grid-column: 1 / -1; }
.back { display: inline-flex; align-items: center; gap: 6px; min-height: 48px; }
.back svg { width: 20px; height: 20px; stroke: currentColor; }

/* Lessons */
.lesson { display: flex; gap: 14px; align-items: center; padding: 14px 18px; width: 100%; background: none; border: 0; text-align: left; cursor: pointer; min-height: 76px; }
.lesson:disabled { cursor: not-allowed; }
.lesson .num { flex: none; width: 46px; height: 46px; border-radius: 12px; background: var(--primary-soft); color: var(--primary); display: grid; place-items: center; font-weight: 800; }
.lesson:disabled .num { background: var(--sunk); color: var(--ink-muted); }
.lesson .num svg { width: 22px; height: 22px; stroke: currentColor; }
.video { aspect-ratio: 16 / 9; max-width: 100%; border-radius: 16px; background: linear-gradient(135deg, var(--primary), color-mix(in srgb, var(--primary) 60%, var(--success))); display: grid; place-items: center; color: var(--surface); text-align: center; padding: 16px; }
.video .play { width: 72px; height: 72px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; margin: 0 auto 10px; border: 0; cursor: pointer; }
.video .play svg { width: 30px; height: 30px; fill: var(--primary); }
.watch-bar { height: 8px; border-radius: 999px; background: var(--hair); overflow: hidden; }
.watch-bar span { display: block; height: 100%; background: var(--success); }

/* Tab bar */
nav.tabs { position: fixed; inset-inline: 0; bottom: 0; background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(12px); border-top: 1px solid var(--hair); padding-bottom: env(safe-area-inset-bottom, 0px); z-index: 5; }
nav.tabs .inner { display: grid; grid-template-columns: repeat(5, 1fr); max-width: 540px; margin: 0 auto; }
nav.tabs button { min-height: 72px; border: 0; background: none; cursor: pointer; display: grid; place-items: center; align-content: center; gap: 3px; color: var(--ink-muted); font-size: .82rem; font-weight: 600; padding: 0; }
nav.tabs svg { width: 25px; height: 25px; stroke: currentColor; }
nav.tabs button[aria-selected="true"] { color: var(--primary); }
nav.tabs button[aria-selected="true"] .pill { background: var(--primary-soft); }
.pill { padding: 4px 14px; border-radius: 999px; display: grid; place-items: center; }

/* Admin */
.admin-top { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
.admin-top .logo { font-size: 1.3rem; }
.admin-top .logo-img { height: 48px; }
.admin-nav { display: flex; gap: 6px; flex-wrap: wrap; }
.admin-nav button { min-height: 44px; padding: 0 16px; border-radius: 10px; border: 0; background: none; cursor: pointer; font-weight: 600; color: var(--ink-muted); }
.admin-nav button[aria-current="page"] { background: var(--primary-soft); color: var(--ink); }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); padding: 14px 16px; display: grid; gap: 2px; }
.kpi b { font-size: 1.7rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.kpi span { font-size: .9rem; color: var(--ink-muted); }
@media (max-width: 700px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.table-wrap { overflow-x: auto; }
table.data { width: 100%; border-collapse: collapse; font-size: .95rem; font-variant-numeric: tabular-nums; }
table.data th { text-align: left; font-size: .8rem; letter-spacing: .03em; text-transform: uppercase; color: var(--ink-muted); font-weight: 700; padding: 12px; border-bottom: 1.5px solid var(--hair); white-space: nowrap; }
table.data th.sortable { padding: 0; }
table.data th button { all: unset; display: flex; gap: 4px; align-items: center; padding: 12px; cursor: pointer; }
table.data th button:focus-visible { outline: 3px solid var(--primary); outline-offset: -3px; }
table.data th.grp { text-align: center; padding: 8px 12px 4px; border-bottom: 0; font-size: .74rem; }
table.data td { padding: 12px; border-bottom: 1px solid var(--hair); white-space: nowrap; }
table.data tbody tr.click { cursor: pointer; }
table.data tbody tr.click:hover td { background: var(--sunk); }
table.data tbody tr.click:focus-visible { outline: 3px solid var(--primary); outline-offset: -3px; }
table.data .num { text-align: right; }
table.data th.num button { justify-content: flex-end; width: 100%; box-sizing: border-box; }
table.data .id { font-weight: 700; color: var(--primary); }
.prior { background: color-mix(in srgb, var(--primary-soft) 40%, var(--surface)); }
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--hair); }
.toolbar .input { max-width: 260px; min-height: 44px; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 640px) { .form-grid { grid-template-columns: 1fr; } }
.code { font-family: ui-monospace, Menlo, monospace; font-size: .82rem; background: var(--sunk); padding: 12px; border-radius: 12px; overflow-x: auto; white-space: pre; }
.record-head { display: flex; gap: 10px 28px; flex-wrap: wrap; align-items: baseline; }
.record-head h2 { font-size: 1.6rem; }
.dl-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 760px) { .dl-grid { grid-template-columns: 1fr; } }

/* Feedback */
.toast { position: fixed; left: 50%; bottom: calc(88px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: min(500px, calc(100% - 32px)); background: var(--ink); color: var(--bg); padding: 16px 18px; border-radius: 16px; font-weight: 600; z-index: 30; box-shadow: var(--shadow); }
.celebrate { position: fixed; inset: 0; display: grid; place-items: center; background: color-mix(in srgb, var(--bg) 75%, transparent); backdrop-filter: blur(3px); z-index: 40; padding: 16px; overflow: hidden; }
.cel-card { background: var(--surface); border-radius: 24px; padding: 32px 24px 24px; text-align: center; display: grid; gap: 12px; max-width: 400px; width: 100%; position: relative; z-index: 2; box-shadow: 0 12px 40px rgb(0 0 0 / .18); }
.cel-card .tick { width: 72px; height: 72px; margin: 0 auto 4px; border-radius: 50%; background: var(--success); display: grid; place-items: center; }
.cel-card .tick svg { width: 40px; height: 40px; stroke: var(--surface); }
.cel-card h2 { font-size: 1.6rem; font-weight: 800; }
.balloon { position: absolute; bottom: -140px; width: 44px; height: 56px; border-radius: 50% 50% 46% 46%; animation: rise 3.4s cubic-bezier(.3,.1,.6,1) forwards; z-index: 1; }
.balloon::after { content: ""; position: absolute; left: 50%; top: 100%; width: 1.5px; height: 44px; background: var(--line); }
@keyframes rise { to { transform: translateY(-125vh) translateX(var(--drift)); } }
@media (prefers-reduced-motion: reduce) { .balloon { display: none; } * { transition: none !important; } }
@media (max-width: 380px) { .goal svg { width: 48px; height: 48px; } .sym-detail { padding-left: 18px; } }

.prose { gap: 14px; line-height: 1.6; }
.prose h1 { font-size: 1.9rem; }
.prose h2 { font-size: 1.25rem; margin-top: 10px; }
.prose ul { margin: 0; padding-left: 1.2em; display: grid; gap: 8px; }
.card { background: var(--surface); border-radius: 24px; box-shadow: var(--shadow); padding: 26px 22px; display: grid; }
.note { background: var(--primary-soft); padding: 12px 16px; border-radius: 14px; }
.goals.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.glances { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.glance { display: grid; gap: 2px; align-content: start; padding: 12px 14px; border-radius: 14px; background: var(--sunk); color: var(--ink); border: 0; text-align: left; font: inherit; cursor: pointer; min-height: 48px; }
.glance b { font-size: 1.15rem; font-weight: 800; }
.glance span { font-size: .92rem; color: var(--ink-muted); }
.glance .tag { justify-self: start; margin-top: 4px; }
.glance.met { background: var(--success-soft); }
.glance:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
.checkin { gap: 8px; }
.checkin ul { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }
.checkin .linkish { min-height: 32px; padding: 0; }
table.data.month th[scope="row"] { white-space: normal; text-transform: none; letter-spacing: 0; font-size: .92rem; color: var(--ink); font-weight: 600; min-width: 110px; padding-right: 4px; }
table.data.month td { padding: 12px 6px; font-size: .95rem; }
table.data.month td.met { color: var(--success); font-weight: 700; }
@media print {
  .switcher, .admin-top, .no-print, nav.tabs, .toast { display: none !important; }
  body { background: #fff; }
  .card.printable { box-shadow: none; padding: 0; }
  @page { size: landscape; }
}
.lesson-video { width: 100%; aspect-ratio: 16 / 9; border-radius: 16px; background: #000; display: block; }
.ok-msg { padding: 12px 16px; border-radius: 14px; font-size: .98rem; font-weight: 600; background: var(--success-soft); color: var(--success); margin: 0; }
</style>

  const toast = msg => { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => { t.hidden = true; }, 3600); };
  function celebrate(text) {
    const c = $('#celebrate'); $('#cel-text').textContent = text; c.hidden = false;
    c.querySelectorAll('.balloon').forEach(b => b.remove());
    if (!reduced) for (let i = 0; i < 12; i++) {
      const b = document.createElement('span'); b.className = 'balloon';
      b.style.left = (4 + Math.random() * 92) + '%'; b.style.background = ['var(--primary)', 'var(--success)', 'var(--primary-soft)', 'var(--success-soft)', 'var(--warn-soft)'][i % 5];
      b.style.animationDelay = (Math.random() * .9) + 's'; b.style.setProperty('--drift', (Math.random() * 90 - 45) + 'px'); c.appendChild(b);
    }
    $('#cel-close').focus();
  }
  $('#cel-close').addEventListener('click', () => { $('#celebrate').hidden = true; });

  /* ---------- lesson files in the demo: kept in this browser only (IndexedDB, or memory when that is blocked) ---------- */
  // Keyed by week ("video-3", "captions-3"), so a moved lesson's files move with it. A removed built-in file is stored as { removed: true }.
  const mediaMem = new Map(); let mediaDb = null;
  const mediaKey = (week, kind) => `${kind}-${week}`;
  function mediaTx(fn) {
    if (!mediaDb) return Promise.resolve();
    return new Promise(res => { try { const tx = mediaDb.transaction('media', 'readwrite'); fn(tx.objectStore('media')); tx.oncomplete = tx.onerror = tx.onabort = () => res(); } catch { res(); } });
  }
  const mediaSet = (week, kind, rec) => { mediaMem.set(mediaKey(week, kind), rec); return mediaTx(st => st.put(rec, mediaKey(week, kind))); };
  const mediaClear = (week, kind) => { mediaMem.delete(mediaKey(week, kind)); return mediaTx(st => st.delete(mediaKey(week, kind))); };
  async function mediaSwap(a, b) {
    for (const kind of ['video', 'captions']) {
      const ra = mediaMem.get(mediaKey(a, kind)), rb = mediaMem.get(mediaKey(b, kind));
      await (ra ? mediaSet(b, kind, ra) : mediaClear(b, kind)); await (rb ? mediaSet(a, kind, rb) : mediaClear(a, kind));
    }
  }

  // Same text as web/src/app/privacy/page.tsx (copied in by hand; keep them in sync).
  function viewPrivacy() {
    return `<div class="wrap" style="max-width:720px"><article class="card prose">
        <h1>Privacy and cookies</h1>
        <p class="note">Draft: waiting for review by the study team and Brown University Health.</p>
        <p>Boost Rx is a research website for a 14-week study run by researchers at Brown University Health. This page explains, in plain language, what the website stores and why. Your study consent form is the main description of how your study information is used; if anything here seems different, the consent form applies.</p>

        <h2>What the website stores</h2>
        <ul>
          <li><strong>What you enter:</strong> meals and snacks, protein, fruits and vegetables, drinks, side effects, activity, weight, and medication doses.</li>
          <li><strong>Lesson viewing:</strong> when you open a lesson, how much of the video you watch, and whether you open the survey link.</li>
          <li><strong>Your account:</strong> your study ID, first name, and password (stored scrambled, so no one can read it).</li>
          <li><strong>Your time zone:</strong> your phone or computer reports its time zone so your days match your own clock. It is saved with your account.</li>
          <li><strong>Sign-in records:</strong> when you sign in, and a scrambled version of your network address, to protect your account from people guessing passwords.</li>
        </ul>

        <h2>Who can see it</h2>
        <p>Only the Boost Rx study team at Brown University Health, for the research study you agreed to. Your information is never sold and never used for advertising.</p>

        <h2>Cookies and storage on your device</h2>
        <ul>
          <li><strong>Sign-in cookie:</strong> keeps you signed in on your device until the program ends, so you don&#39;t have to type your password each day. It is removed when you sign out.</li>
          <li><strong>A small note on your device:</strong> remembers which goal celebrations you have already seen, so they don&#39;t pop up twice. It stays on your device and is never sent to anyone.</li>
          <li><strong>Study staff</strong> have their own sign-in cookie, which lasts 8 hours.</li>
        </ul>
        <p>That is all. The website has <strong>no advertising, analytics, or tracking cookies</strong>, and nothing on it comes from outside companies (even the lettering and lesson videos come from the Boost Rx website itself). The weekly survey links open the survey tool the study team uses, which has its own privacy terms. Because these cookies are needed for signing in, there is nothing to turn on or off. If your browser blocks all cookies, you won&#39;t be able to sign in.</p>

  /* ---------- participant website ---------- */

  const weekDays = w => Array.from({ length: 7 }, (_, i) => weekStart(w) + i * DAY);

  const fmtTime = hhmm => { const [h, m] = hhmm.split(':').map(Number); return `${h % 12 || 12}:${String(m).padStart(2, '0')} ${h < 12 ? 'AM' : 'PM'}`; };
  const greeting = () => { const h = +new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', hour: 'numeric', hourCycle: 'h23' }).format(new Date()); return h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening'; };

  // Weight & Meds: today's weight first, earlier days in a dropdown below, then the graph and medication

  function viewWeight() {
    const pts = Object.keys(days).map(Number).sort((a, b) => a - b).filter(t => days[t].weight).map(t => ({ t, w: days[t].weight }));
    const first = pts[0], last = pts[pts.length - 1], lost = +(first.w - last.w).toFixed(1), pct = (Math.abs(lost) / first.w * 100).toFixed(1);
    const thisWeek = weekDays(NOW_WEEK).filter(t => days[t]?.weight).length, sel = pts.find(p => p.t === S.wsel) || last;

      <div class="group pad">

        <div class="wchart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight went from ${first.w} to ${last.w} pounds since ${fmt(first.t, { month: 'long', day: 'numeric' })}">

  /* ---------- monthly summary (same rules and wording as web/src/lib/message-text.ts, DRAFT for the team) ---------- */
  const MONTHS = [1, 2, 3];
  const monthWeeks = m => [m * 4 - 3, m * 4 - 2, m * 4 - 1, m * 4];
  /** Month m's summary opens on the first day of the week after it ends. */
  const monthOpen = m => TODAY >= weekStart(m * 4 + 1);
  const TIPS = {
    activity: 'Try adding one 10-minute brisk walk on a day you usually skip.',
    strength: 'Pick two days for strength training and put them on your calendar.',
    protein: 'Add a protein food to a snack, such as Greek yogurt, a cheese stick, or a hard-boiled egg.',
    fruitVeg: 'Add one serving of fruit or vegetables to a meal you already eat.',
    hydration: 'Keep a water bottle where you can see it and refill it twice a day.',
    weighing: 'Weigh yourself on the same two mornings each week.',
  };
  const TIP_LABEL = { activity: 'aerobic exercise', strength: 'strength training', protein: 'protein', fruitVeg: 'fruits and vegetables', hydration: 'sugar-free drinks', weighing: 'self-weighing' };
  function monthlyNote(weeks, daysPossible, scope = 'month') {
    const span = scope === 'month' ? 'this month' : 'over the program';
    const logged = weeks.reduce((a, w) => a + w.daysLogged, 0);
    const effort = `You logged on ${logged} of ${daysPossible} days ${span}.${logged >= daysPossible * 0.7 ? " That's real consistency." : ' Every entry helps you see your own patterns.'}`;
    const share = w => ({
      activity: Math.min(1, w.mins / w.goal), strength: Math.min(1, w.str / 2),
      protein: w.avgProt === null ? null : Math.min(1, w.avgProt / PROTEIN_GOAL), fruitVeg: w.avgFv === null ? null : Math.min(1, w.avgFv / 5),
      hydration: w.avgBev === null ? null : Math.min(1, w.avgBev / 8), weighing: Math.min(1, w.weighIns / 2),
    });
    const keys = Object.keys(TIPS);
    const avg = (ws, k) => { const v = ws.map(w => share(w)[k]).filter(x => x !== null); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
    const half = Math.max(1, Math.floor(weeks.length / 2)), early = weeks.slice(0, half), late = weeks.slice(half);
    let best = null;
    for (const k of keys) { const a = avg(early, k), b = avg(late, k); if (a !== null && b !== null && b - a >= 0.1 && (!best || b - a > best.gain)) best = { k, gain: b - a }; }
    const trend = best ? `Your ${TIP_LABEL[best.k]} improved ${scope === 'month' ? 'over the month' : 'over the program'}. That trend matters more than any single week.`
      : "Some weeks are harder than others, and that's normal. What matters is the overall direction, not a perfect week.";
    let focus = 'activity', low = Infinity;
    for (const k of keys) { const v = avg(weeks, k); if (v !== null && v < low) { low = v; focus = k; } }
    return { effort, trend, action: TIPS[focus], reflect: `Think about your best week ${span}. What helped most, and how could you repeat it?` };
  }
  function viewMonth() {

  /* ---------- admin ---------- */
  // Codes match the real website's database and downloads exactly (web/src/lib/program.ts and reports.ts).
  const REASON_KEYS = { 'Habit or routine': 'habit', 'Emotional reasons': 'emotional', 'Social situation': 'social', 'Food cravings or desire to eat': 'cravings', 'Other': 'other' };
  const ACT_KEYS = ['aerobics_class', 'brisk_walking', 'bicycling', 'dancing', 'elliptical', 'hiit', 'pickleball', 'running', 'sport', 'lap_swimming', 'water_aerobics', 'weight_lifting', 'yoga_pilates', 'other'];
  const actKey = a => ACT_KEYS[ACTS.indexOf(a)] ?? a;

  const firsts = ['Linda', 'Robert', 'Carol', 'James', 'Denise', 'Michael', 'Patricia', 'Thomas', 'Angela', 'Gary', 'Sharon', 'Frank', 'Teresa', 'Paul'];
  const OFFS = [0, -14, -7, 7, -21, 0, -28, 14, -7, -35, 0, -91, -98, 21], AGO = [0, 1, 0, null, 4, 0, 2, null, 0, 6, 1, 3, 9, null];
  const BASES = [80, 140, 60, 120, 200, 95, 30, 150, 110, 70, 260, 90, 130, 100];
  const pdays = {}, pmeds = {};
  const PEOPLE = firsts.map((first, i) => ({ id: `BRX-${String(i === 0 ? 14 : i < 14 ? i : 15).padStart(3, '0')}`, first, start: START + OFFS[i] * DAY, baseline: BASES[i], ago: AGO[i] }));
  // Every sample participant gets a full, consistent history, so the table, the record, and the downloads agree.
  PEOPLE.forEach(p => {
    if (p.id === 'BRX-014') { pdays[p.id] = days; pmeds[p.id] = med; return; }
    pdays[p.id] = {}; pmeds[p.id] = { doses: [] };
    if (p.ago === null) return;
    seed = 900 + p.id.charCodeAt(6) * 17 + p.id.charCodeAt(5) * 3;
    const last = Math.min(TODAY - p.ago * DAY, p.start + 97 * DAY), w0 = 190 + Math.round(rnd() * 40);
    for (let t = p.start; t <= last; t += DAY) {
      if (rnd() < .12) continue;
      const d = blankDay();
      fakeMeals(d, .5);
      d.fv = 1 + Math.floor(rnd() * 6); d.bev = 3 + Math.floor(rnd() * 6);
      if (rnd() < .3) d.sym[SYMPTOMS[Math.floor(rnd() * 6)][0]] = 1 + Math.floor(rnd() * 3);
      d.ex = rnd() < .6; if (d.ex) { d.mins = [20, 25, 30, 40, 45][Math.floor(rnd() * 5)]; d.acts = [ACTS[[2, 7, 12, 0, 6, 1][Math.floor(rnd() * 6)]]]; }

  async function lessonUpload(input) {
    const f = input.files?.[0], id = +input.dataset.id, kind = input.dataset.kind, key = `${id}-${kind}`, l = lessons.find(x => x.id === id);

    let err = null, blob = null;
    try {

        // Same check as the real website: the browser must call it an MP4, and every MP4 has "ftyp" at bytes 4-7.
        const head = new Uint8Array(await f.slice(0, 8).arrayBuffer());
        if ((f.type && f.type !== 'video/mp4') || String.fromCharCode(...head.slice(4, 8)) !== 'ftyp') err = "That isn't an MP4 video. In Canva, download as MP4.";
        else if (f.size > 2 * 1024 ** 3) err = 'That upload was cut off or larger than 2 GB. Please try again.';
        else blob = new Blob([f], { type: 'video/mp4' });
      } else {
        const text = f.size > 2 * 1024 ** 2 ? null : (await f.text()).replace(/^\uFEFF/, '');
        if (text === null) err = 'Caption files can be up to 2 MB.';
        else if (!text.startsWith('WEBVTT') && !/\d\d:\d\d:\d\d,\d\d\d\s+-->/.test(text)) err = 'Captions must be a .vtt or .srt file.';
        else blob = new Blob([text.startsWith('WEBVTT') ? text : srtToVtt(text)], { type: 'text/vtt' });

      }
      render();
    }, 150);
  }
